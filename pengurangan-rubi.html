<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Ayo Berhitung dengan Rubi 🦊</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --sky:#EAF5FF;
    --sky-deep:#CFEBFF;
    --coral:#FF6F5E;
    --coral-dark:#E85443;
    --yellow:#FFC93C;
    --yellow-dark:#F0AE12;
    --mint:#3FBFAE;
    --mint-dark:#2FA394;
    --grape:#8B6FD6;
    --ink:#2B2250;
    --white:#FFFFFF;
    --gray:#8A87A6;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;
    padding:0;
    min-height:100vh;
    background:
      radial-gradient(circle at 8% 12%, var(--sky-deep) 0%, transparent 42%),
      radial-gradient(circle at 92% 85%, #D7F4EE 0%, transparent 40%),
      var(--sky);
    font-family:'Quicksand', sans-serif;
    color:var(--ink);
    overflow-x:hidden;
  }
  .cloud{
    position:absolute;
    background:#fff;
    border-radius:50%;
    opacity:0.7;
    filter:blur(0.5px);
  }
  .app{
    max-width:720px;
    margin:0 auto;
    padding:20px 16px 60px;
    position:relative;
    z-index:1;
  }

  /* HEADER */
  header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    margin-bottom:18px;
  }
  .brand{
    display:flex;
    align-items:center;
    gap:10px;
  }
  .mascot{
    font-size:44px;
    filter:drop-shadow(0 4px 0 rgba(0,0,0,0.08));
    animation:bob 3s ease-in-out infinite;
  }
  @keyframes bob{
    0%,100%{transform:translateY(0) rotate(-3deg);}
    50%{transform:translateY(-6px) rotate(3deg);}
  }
  h1{
    font-family:'Baloo 2', cursive;
    font-size:22px;
    margin:0;
    line-height:1.1;
    color:var(--ink);
  }
  h1 span{
    display:block;
    font-size:13px;
    font-weight:600;
    color:var(--gray);
    margin-top:2px;
  }
  .stars{
    display:flex;
    align-items:center;
    gap:6px;
    background:var(--white);
    border-radius:999px;
    padding:8px 16px;
    box-shadow:0 4px 0 rgba(43,34,80,0.08);
    font-family:'Baloo 2', cursive;
    font-weight:700;
    font-size:18px;
    color:var(--yellow-dark);
  }

  /* PROGRESS DOTS */
  .progress{
    display:flex;
    justify-content:center;
    gap:7px;
    margin-bottom:20px;
    flex-wrap:wrap;
  }
  .dot{
    width:16px;height:16px;
    border-radius:50%;
    background:#fff;
    border:2.5px solid var(--sky-deep);
    transition:all .3s ease;
  }
  .dot.done{
    background:var(--mint);
    border-color:var(--mint-dark);
    transform:scale(1.1);
  }
  .dot.current{
    border-color:var(--coral);
    box-shadow:0 0 0 4px rgba(255,111,94,0.18);
  }

  /* MAIN CARD */
  .card{
    background:var(--white);
    border-radius:32px;
    padding:28px 20px 32px;
    box-shadow:0 14px 0 rgba(43,34,80,0.06), 0 4px 20px rgba(43,34,80,0.06);
    position:relative;
    overflow:hidden;
  }
  .prompt{
    text-align:center;
    font-family:'Baloo 2', cursive;
    font-weight:700;
    font-size:19px;
    color:var(--ink);
    margin:0 0 18px;
  }
  .prompt b{color:var(--coral-dark);}

  .stage{
    background:var(--sky);
    border-radius:24px;
    padding:18px 14px 14px;
    min-height:150px;
    display:flex;
    flex-wrap:wrap;
    align-content:flex-start;
    gap:10px;
    justify-content:center;
    margin-bottom:16px;
    position:relative;
  }
  .obj{
    font-size:38px;
    line-height:1;
    transition: transform .5s cubic-bezier(.5,-0.4,.5,1.4), opacity .5s ease;
    user-select:none;
  }
  .obj.taken{
    transform: translate(160px,-90px) scale(0.3) rotate(25deg);
    opacity:0;
  }
  .basket{
    position:absolute;
    right:10px;
    top:6px;
    font-size:34px;
    opacity:0.9;
  }
  .removed-tag{
    position:absolute;
    right:12px;
    top:44px;
    background:var(--coral);
    color:#fff;
    font-family:'Baloo 2', cursive;
    font-weight:700;
    font-size:13px;
    padding:3px 10px;
    border-radius:999px;
    opacity:0;
    transition:opacity .4s ease;
  }
  .removed-tag.show{opacity:1;}

  .equation{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    font-family:'Baloo 2', cursive;
    font-weight:800;
    font-size:34px;
    color:var(--ink);
    margin:14px 0 22px;
    flex-wrap:wrap;
  }
  .equation .op{color:var(--coral-dark);}
  .qmark{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    width:52px;height:52px;
    background:var(--yellow);
    border-radius:16px;
    color:#fff;
    box-shadow:0 4px 0 var(--yellow-dark);
  }

  .choices{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
  }
  .choice{
    font-family:'Baloo 2', cursive;
    font-weight:700;
    font-size:28px;
    color:var(--ink);
    background:#fff;
    border:3px solid var(--sky-deep);
    border-radius:20px;
    padding:16px 0;
    cursor:pointer;
    box-shadow:0 5px 0 var(--sky-deep);
    transition:transform .12s ease, box-shadow .12s ease, background .2s ease, border-color .2s ease;
  }
  .choice:active{
    transform:translateY(3px);
    box-shadow:0 2px 0 var(--sky-deep);
  }
  .choice.correct{
    background:var(--mint);
    border-color:var(--mint-dark);
    color:#fff;
    box-shadow:0 5px 0 var(--mint-dark);
  }
  .choice.wrong{
    background:var(--coral);
    border-color:var(--coral-dark);
    color:#fff;
    box-shadow:0 5px 0 var(--coral-dark);
    animation:shake .4s ease;
  }
  .choice.disabled{
    pointer-events:none;
    opacity:0.55;
  }
  @keyframes shake{
    0%,100%{transform:translateX(0);}
    20%{transform:translateX(-8px);}
    40%{transform:translateX(8px);}
    60%{transform:translateX(-6px);}
    80%{transform:translateX(6px);}
  }

  .feedback{
    text-align:center;
    font-family:'Baloo 2', cursive;
    font-weight:700;
    font-size:17px;
    min-height:26px;
    margin-top:16px;
    color:var(--mint-dark);
  }
  .feedback.bad{color:var(--coral-dark);}

  .next-btn{
    display:block;
    margin:14px auto 0;
    font-family:'Baloo 2', cursive;
    font-weight:700;
    font-size:16px;
    color:#fff;
    background:var(--grape);
    border:none;
    border-radius:999px;
    padding:12px 26px;
    box-shadow:0 5px 0 #6E54B5;
    cursor:pointer;
    opacity:0;
    pointer-events:none;
    transition:opacity .3s ease;
  }
  .next-btn.show{opacity:1;pointer-events:auto;}
  .next-btn:active{transform:translateY(3px);box-shadow:0 2px 0 #6E54B5;}

  /* DONE SCREEN */
  .done-screen{
    display:none;
    text-align:center;
    padding:20px 6px;
  }
  .done-screen.show{display:block;}
  .done-screen .big-emoji{font-size:70px;}
  .done-screen h2{
    font-family:'Baloo 2', cursive;
    font-size:26px;
    margin:6px 0 4px;
  }
  .done-screen p{
    color:var(--gray);
    font-weight:600;
    margin:0 0 20px;
  }
  .restart-btn{
    font-family:'Baloo 2', cursive;
    font-weight:700;
    font-size:17px;
    color:#fff;
    background:var(--coral);
    border:none;
    border-radius:999px;
    padding:14px 30px;
    box-shadow:0 5px 0 var(--coral-dark);
    cursor:pointer;
  }
  .restart-btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--coral-dark);}

  .confetti{
    position:fixed;
    top:-20px;
    font-size:22px;
    pointer-events:none;
    animation: fall linear forwards;
    z-index:50;
  }
  @keyframes fall{
    to{ transform: translateY(110vh) rotate(360deg); opacity:0.2; }
  }

  footer{
    text-align:center;
    color:var(--gray);
    font-size:12px;
    font-weight:600;
    margin-top:24px;
  }

  @media (max-width:420px){
    .obj{font-size:32px;}
    .equation{font-size:28px;}
    .choice{font-size:24px;}
  }
</style>
</head>
<body>

<div class="app">
  <header>
    <div class="brand">
      <div class="mascot">🦊</div>
      <h1>Ayo Berhitung dengan Rubi<span>Belajar pengurangan itu seru!</span></h1>
    </div>
    <div class="stars">⭐ <span id="starCount">0</span></div>
  </header>

  <div class="progress" id="progress"></div>

  <div class="card" id="gameCard">
    <p class="prompt" id="promptText">Berapa sisa buahnya?</p>

    <div class="stage" id="stage">
      <div class="basket">🧺</div>
      <div class="removed-tag" id="removedTag"></div>
    </div>

    <div class="equation">
      <span id="eqA">5</span>
      <span class="op">−</span>
      <span id="eqB">2</span>
      <span class="op">=</span>
      <span class="qmark">?</span>
    </div>

    <div class="choices" id="choices"></div>

    <p class="feedback" id="feedback">&nbsp;</p>
    <button class="next-btn" id="nextBtn">Soal berikutnya ➜</button>
  </div>

  <div class="done-screen" id="doneScreen">
    <div class="big-emoji">🏆</div>
    <h2>Hebat sekali!</h2>
    <p id="doneMsg">Kamu berhasil menyelesaikan semua soal!</p>
    <button class="restart-btn" id="restartBtn">Main lagi dari awal</button>
  </div>

  <footer>Dibuat untuk anak TK — sentuh jawaban yang benar ya! 🌈</footer>
</div>

<script>
(function(){
  const TOTAL = 10;
  const objectSets = ["🍎","🍌","🍊","🍓","🎈","⭐","🐟","🍬","🌸","🧸"];

  let state = {
    index: 0,
    stars: 0,
    a: 0,
    b: 0,
    answered: false
  };

  const progressEl = document.getElementById('progress');
  const stageEl = document.getElementById('stage');
  const eqA = document.getElementById('eqA');
  const eqB = document.getElementById('eqB');
  const choicesEl = document.getElementById('choices');
  const feedbackEl = document.getElementById('feedback');
  const nextBtn = document.getElementById('nextBtn');
  const starCountEl = document.getElementById('starCount');
  const removedTag = document.getElementById('removedTag');
  const gameCard = document.getElementById('gameCard');
  const doneScreen = document.getElementById('doneScreen');
  const restartBtn = document.getElementById('restartBtn');
  const doneMsg = document.getElementById('doneMsg');

  function buildProgress(){
    progressEl.innerHTML = '';
    for(let i=0;i<TOTAL;i++){
      const d = document.createElement('div');
      d.className = 'dot';
      d.id = 'dot-'+i;
      progressEl.appendChild(d);
    }
  }

  function updateProgressUI(){
    for(let i=0;i<TOTAL;i++){
      const d = document.getElementById('dot-'+i);
      d.classList.remove('current','done');
      if(i < state.index) d.classList.add('done');
      if(i === state.index) d.classList.add('current');
    }
  }

  function randInt(min,max){
    return Math.floor(Math.random()*(max-min+1))+min;
  }

  function newProblem(){
    state.answered = false;
    feedbackEl.textContent = '\u00A0';
    feedbackEl.classList.remove('bad');
    nextBtn.classList.remove('show');
    removedTag.classList.remove('show');

    const a = randInt(4,9);
    const b = randInt(1, Math.min(a,5));
    state.a = a;
    state.b = b;
    const answer = a - b;

    eqA.textContent = a;
    eqB.textContent = b;

    const emoji = objectSets[randInt(0,objectSets.length-1)];
    stageEl.querySelectorAll('.obj').forEach(el=>el.remove());
    for(let i=0;i<a;i++){
      const s = document.createElement('span');
      s.className = 'obj';
      s.textContent = emoji;
      s.dataset.idx = i;
      stageEl.appendChild(s);
    }

    setTimeout(()=>{
      const objs = Array.from(stageEl.querySelectorAll('.obj'));
      for(let i=0;i<b;i++){
        setTimeout(()=>{
          if(objs[objs.length-1-i]){
            objs[objs.length-1-i].classList.add('taken');
          }
          if(i === b-1){
            setTimeout(()=>{
              removedTag.textContent = 'diambil ' + b;
              removedTag.classList.add('show');
            },300);
          }
        }, i*350);
      }
    }, 500);

    buildChoices(answer, a);
  }

  function buildChoices(answer, maxVal){
    choicesEl.innerHTML = '';
    const opts = new Set([answer]);
    while(opts.size < 4){
      let delta = randInt(-2,2);
      let candidate = answer + delta;
      if(candidate < 0) candidate = answer + Math.abs(delta) + 1;
      if(candidate > maxVal) candidate = Math.max(0, answer - Math.abs(delta) - 1);
      if(candidate < 0 || candidate > maxVal) candidate = randInt(0,maxVal);
      opts.add(candidate);
    }
    const arr = Array.from(opts);
    // shuffle
    for(let i=arr.length-1;i>0;i--){
      const j = Math.floor(Math.random()*(i+1));
      [arr[i],arr[j]] = [arr[j],arr[i]];
    }
    arr.forEach(val=>{
      const btn = document.createElement('button');
      btn.className = 'choice';
      btn.textContent = val;
      btn.addEventListener('click', ()=>handleChoice(btn, val, answer));
      choicesEl.appendChild(btn);
    });
  }

  function handleChoice(btn, val, answer){
    if(state.answered) return;
    if(val === answer){
      state.answered = true;
      btn.classList.add('correct');
      feedbackEl.textContent = 'Betul sekali! Kamu hebat! 🎉';
      feedbackEl.classList.remove('bad');
      state.stars++;
      starCountEl.textContent = state.stars;
      launchConfetti();
      document.querySelectorAll('.choice').forEach(c=>c.classList.add('disabled'));
      nextBtn.classList.add('show');
    } else {
      btn.classList.add('wrong');
      btn.classList.add('disabled');
      feedbackEl.textContent = 'Hampir! Coba hitung lagi ya 🙂';
      feedbackEl.classList.add('bad');
      setTimeout(()=>btn.classList.remove('wrong'), 450);
    }
  }

  function launchConfetti(){
    const emojis = ['⭐','🎉','🌟','✨'];
    for(let i=0;i<16;i++){
      const c = document.createElement('div');
      c.className = 'confetti';
      c.textContent = emojis[randInt(0,emojis.length-1)];
      c.style.left = randInt(2,98)+'vw';
      c.style.animationDuration = (1.6+Math.random()*1.2)+'s';
      document.body.appendChild(c);
      setTimeout(()=>c.remove(), 3000);
    }
  }

  nextBtn.addEventListener('click', ()=>{
    state.index++;
    updateProgressUI();
    if(state.index >= TOTAL){
      gameCard.style.display = 'none';
      doneScreen.classList.add('show');
      doneMsg.textContent = 'Kamu mengumpulkan ' + state.stars + ' dari ' + TOTAL + ' bintang. Keren banget!';
    } else {
      newProblem();
    }
  });

  restartBtn.addEventListener('click', ()=>{
    state.index = 0;
    state.stars = 0;
    starCountEl.textContent = 0;
    doneScreen.classList.remove('show');
    gameCard.style.display = 'block';
    buildProgress();
    updateProgressUI();
    newProblem();
  });

  buildProgress();
  updateProgressUI();
  newProblem();
})();
</script>

</body>
</html>
